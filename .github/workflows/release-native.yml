name: Release Native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-darwin
          - runner: ubuntu-24.04
            target: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13

      - name: Restore Nix store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /nix/store
          key: edge-runtime-${{ matrix.target }}-${{ hashFiles('flake.lock') }}
          restore-keys: edge-runtime-${{ matrix.target }}-

      - name: Build
        run: |
          nix build --extra-experimental-features "nix-command flakes" \
            --system ${{ matrix.target }}
      - name: Package
        run: |
          TAR="edge-runtime-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$TAR" \
            --dereference \
            -C "$(readlink -f ./result)" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-runtime-${{ matrix.target }}
          path: edge-runtime-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          retention-days: 1

  attest:
    name: Checksums & Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: edge-runtime-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum edge-runtime-*.tar.gz > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/edge-runtime-*.tar.gz

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: dist/SHA256SUMS
          retention-days: 1

  release:
    name: Create Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List files (debug)
        run: ls -R artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/**/*
